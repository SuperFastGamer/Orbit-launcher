name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle and Build
        run: |
          set -e

          # 1. Download standalone Gradle 8.7 if not present
          if [ ! -d "gradle-8.7" ]; then
            echo "==> Downloading Gradle 8.7..."
            curl -sLO https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
          fi

          # 2. Safely create settings.gradle.kts using clean echo statements
          if [ -f "build.gradle.kts" ] && [ ! -d "app" ]; then
            echo "==> Configuring flat project layout..."
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "Orbit-launcher"' >> settings.gradle.kts
          else
            echo "==> Configuring standard multi-project layout..."
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "Orbit-launcher"' >> settings.gradle.kts
            echo 'if (file("app").exists()) { include(":app") }' >> settings.gradle.kts
          fi

          # 3. Compile the APK
          echo "==> Compiling APK..."
          ./gradle-8.7/bin/gradle assembleDebug || ./gradle-8.7/bin/gradle :app:assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
