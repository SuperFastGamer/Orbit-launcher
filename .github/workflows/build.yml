name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle and Build APK
        run: |
          set -e

          echo "=== 1. Inspecting repository layout ==="
          ls -la

          # If code was committed inside a subfolder, enter it
          if [ -d "Orbit-launcher" ] && [ -f "Orbit-launcher/build.gradle.kts" ]; then
            echo "Entering subfolder Orbit-launcher..."
            cd Orbit-launcher
          fi

          echo "=== 2. Downloading standalone Gradle 8.7 ==="
          if [ ! -d "gradle-8.7" ]; then
            curl -sLO https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            rm -f gradle-8.7-bin.zip
          fi

          echo "=== 3. Writing settings.gradle.kts cleanly ==="
          if [ -d "app" ] && [ -f "app/build.gradle.kts" ]; then
            echo "Multi-project layout detected."
            printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n' > settings.gradle.kts
            printf 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }\n' >> settings.gradle.kts
            printf 'rootProject.name = "Orbit-launcher"\n' >> settings.gradle.kts
            printf 'include(":app")\n' >> settings.gradle.kts
          else
            echo "Flat single-project layout detected."
            printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n' > settings.gradle.kts
            printf 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }\n' >> settings.gradle.kts
            printf 'rootProject.name = "Orbit-launcher"\n' >> settings.gradle.kts
          fi

          echo "=== 4. Checking available Gradle tasks ==="
          ./gradle-8.7/bin/gradle projects
          ./gradle-8.7/bin/gradle tasks --group="build" || true

          echo "=== 5. Compiling Debug APK ==="
          ./gradle-8.7/bin/gradle assembleDebug || ./gradle-8.7/bin
          
