name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle and Build APK
        run: |
          set -e

          # Move into subfolder if project files are nested
          if [ -d "Orbit-launcher" ] && [ -f "Orbit-launcher/build.gradle.kts" ]; then
            cd Orbit-launcher
          fi

          # Auto-create settings.gradle.kts if missing
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "Orbit-launcher"' >> settings.gradle.kts
            echo 'if (file("app").exists()) { include(":app") }' >> settings.gradle.kts
          fi

          # Install standalone Gradle 8.7 if wrapper is absent
          if [ ! -f "./gradlew" ]; then
            echo "==> Downloading Gradle 8.7..."
            curl -sLO https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            ./gradle-8.7/bin/gradle wrapper
            rm -rf gradle-8.7-bin.zip gradle-8.7
          fi

          chmod +x gradlew

          echo "==> Compiling Debug APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
