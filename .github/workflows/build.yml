name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle and Build APK
        run: |
          # If files were pushed inside a subdirectory, locate and move into it
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
            if [ -n "$SUBDIR" ]; then
              echo "Moving into project directory: $SUBDIR"
              cd "$SUBDIR"
            fi
          fi

          # Install standalone Gradle 8.7 if wrapper is absent
          if [ ! -f "./gradlew" ]; then
            echo "Installing standalone Gradle..."
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle-bin.zip
            unzip -q gradle-bin.zip
            ./gradle-8.7/bin/gradle wrapper
            rm -rf gradle-bin.zip gradle-8.7
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
