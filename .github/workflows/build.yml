name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle and Build APK
        run: |
          # 1. If project files are inside a nested subfolder, move into it
          if [ -d "Orbit-launcher" ] && [ -f "Orbit-launcher/build.gradle.kts" ]; then
            cd Orbit-launcher
          fi

          # 2. Automatically generate settings.gradle.kts if missing
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "==> Creating missing settings.gradle.kts..."
            cat << 'EOF' > settings.gradle.kts
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Orbit-launcher"
if (file("app").exists()) {
    include(":app")
}
EOF
          fi

          # 3. Download standalone Gradle 8.7 to create wrapper
          if [ ! -f "./gradlew" ]; then
            echo "==> Downloading Gradle 8.7..."
            curl -sLO https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            ./gradle-8.7/bin/gradle wrapper
            rm -rf gradle-8.7-bin.zip gradle-8.7
          fi

          chmod +x gradlew

          # 4. Compile the APK
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
